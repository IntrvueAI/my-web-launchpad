
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <script>
      // Remove bearer invitations before app logging or third-party assets load.
      (function () {
        var match = location.pathname.match(/^\/medicine\/([A-Za-z0-9_-]{22})$/);
        if (match || ['/try', '/guest-session', '/guest-feedback'].includes(location.pathname)) {
          var robots = document.createElement('meta'); robots.name = 'robots'; robots.content = 'noindex, nofollow'; document.head.appendChild(robots);
        }
        if (match) {
          try { sessionStorage.setItem('mmi:trial-invite', match[1]); history.replaceState({}, '', '/try'); } catch (_) {}
        }
      })();
    </script>
    <title>Intrvue AI - 11+ Interview Preparation</title>
    <link rel="icon" href="/lovable-uploads/icon-mark.png" type="image/png">
    <meta name="description" content="AI-powered interview preparation for UK 11+ private and grammar school admissions. Practice with digital humans and get instant feedback." />
    <meta name="author" content="intrvue.ai" />

    <!-- Nunito (body) + Fredoka (headings) — the app's actual fonts (see src/index.css's
         font-sans/font-display). Loaded here via <link>, not @import in the CSS: a <link> in the
         initial HTML is discovered by the browser's preload scanner before any CSS is even
         parsed, where an @import can only be discovered after index.css itself has been fetched
         and parsed — a fully serial extra round-trip that delays text rendering on every page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <meta property="og:title" content="intrvue.ai — 11+ Interview Preparation with AI" />
    <meta property="og:description" content="AI-powered interview preparation for UK 11+ private and grammar school admissions. Practice with digital humans and get instant feedback." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <!-- Applies the saved theme before first paint (no flash of the wrong theme). Defaults to
         dark — the app's always-been-dark default — so existing users see no change unless they
         explicitly toggle to light. -->
    <script>
      (function () {
        try { var saved = localStorage.getItem('intrvue-theme'); if (saved !== 'light') document.documentElement.classList.add('dark'); } catch (_) {}
        var medicine = ['mmipractice.co.uk', 'www.mmipractice.co.uk', 'mmi.localhost'].includes(location.hostname.toLowerCase());
        if (medicine) {
          document.title = 'MMI Practice | Medicine interview preparation';
          var description = 'Practise medical school interviews with an AI interviewer. Explore MMI scenarios, worked answers and focused feedback.';
          document.querySelector('meta[name="description"]').content = description;
          document.querySelector('meta[property="og:title"]').content = document.title;
          document.querySelector('meta[property="og:description"]').content = description;
          document.querySelector('link[rel="icon"]').href = '/mmi-icon.svg';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
