name: Backend regression checks
on:
  push:
    branches: [main]
    paths:
      [
        "supabase/**",
        "scripts/**",
        "src/interview/**",
        "src/hooks/**",
        "package*.json",
        ".github/workflows/backend-checks.yml",
      ]
  pull_request:
    paths:
      [
        "supabase/**",
        "scripts/**",
        "src/interview/**",
        "src/hooks/**",
        "package*.json",
        ".github/workflows/backend-checks.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:backend
      - run: npm install --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - run: npm run backend:sql-check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: Check every edge function
        run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts
