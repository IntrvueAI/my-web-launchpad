project_id = "fjkuuzfuysemrofcmnvd"

[functions.send-bug-report]
verify_jwt = true

# Tavus calls this directly as a webhook — it has no Supabase JWT to send.
[functions.tavus-webhook]
verify_jwt = false

# Stripe calls this directly as a webhook (signed with stripe-signature, not a Supabase JWT) — without
# this override the platform's default verify_jwt=true 401s every real Stripe event before the
# function's own signature check ever runs, silently breaking the payment-confirmation safety net for
# any customer who closes the tab before the client-side redirect completes.
[functions.stripe-webhook]
verify_jwt = false

[functions.tavus-create-conversation]
verify_jwt = true

[functions.tavus-end-conversation]
verify_jwt = true

# Browser WebSocket upgrade requests can't carry a custom Authorization header, so this verifies
# the user's token itself (passed as ?token=) instead of relying on the platform's auto-check.
[functions.deepgram-relay]
verify_jwt = false

# Same reason as deepgram-relay — verified manually via ?token= instead.
[functions.stt-bakeoff-relay]
verify_jwt = false